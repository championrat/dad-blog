<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Markdown Blog</title>
  <meta name="description" content="A blog built with Markdown and GitHub Pages.">
  <meta name="author" content="Darsh">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://blog.example.com/">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: auto; padding: 20px; }
    .post { margin-bottom: 50px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
    .post h2 { margin: 0 0 10px; }
    .meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
    pre, code { background: #f4f4f4; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>My Blog</h1>
  <div id="blog-container">Loading posts...</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
